<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rowan Draw — Catalog Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --success: #22c55e;
      --danger: #ef4444;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --border: #334155;
    }
    * { box-sizing: border-box; }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 0;
    }
    header {
      background: #090d16;
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .brand h1 { margin: 0; font-size: 1.25rem; font-weight: 700; color: #fff; }
    .badge {
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .stats {
      display: flex;
      gap: 1.5rem;
      font-size: 0.85rem;
      color: var(--text-sub);
    }
    .stats span strong { color: #fff; }
    .actions { display: flex; gap: 0.75rem; }
    button {
      font-family: inherit;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-primary { background: var(--accent); color: #090d16; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-secondary { background: var(--card-bg); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { background: #334155; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-danger { background: rgba(239, 68, 68, 0.2); color: var(--danger); border: 1px solid var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }

    main { max-width: 1400px; margin: 0 auto; padding: 2rem; }
    .filters {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      background: var(--card-bg);
      padding: 1rem 1.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .filter-group { display: flex; gap: 1rem; align-items: center; }
    select, input[type="text"] {
      font-family: inherit;
      background: #090d16;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.5rem 0.8rem;
      border-radius: 6px;
      font-size: 0.85rem;
    }
    
    .variant-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 2rem;
    }
    .variant-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .variant-title h2 { margin: 0 0 0.25rem 0; font-size: 1.1rem; }
    .variant-meta { font-size: 0.8rem; color: var(--text-sub); }
    .prompt-box {
      margin-bottom: 1.5rem;
      background: #090d16;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .prompt-box textarea {
      width: 100%;
      background: transparent;
      border: none;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.85rem;
      resize: vertical;
      min-height: 50px;
    }
    .prompt-actions { display: flex; justify-content: flex-end; gap: 0.5rem; margin-top: 0.5rem; }

    .images-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1.5rem;
      margin-bottom: 1.5rem;
    }
    .image-card {
      background: #090d16;
      border: 2px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s;
    }
    .image-card.accepted { border-color: var(--success); box-shadow: 0 0 15px rgba(34, 197, 94, 0.2); }
    .image-card.rejected { border-color: var(--danger); opacity: 0.5; }
    .image-card img { width: 100%; aspect-ratio: 1/1; object-fit: contain; background: #fff; }
    .image-controls { padding: 0.75rem; display: flex; justify-content: space-between; align-items: center; background: #090d16; }

    .tag-pills { display: flex; flex-wrap: wrap; gap: 0.3rem; margin-top: 0.5rem; }
    .tag-pill { background: #1e293b; color: var(--text-sub); font-size: 0.7rem; padding: 0.1rem 0.4rem; border-radius: 4px; }

    .retry-bar {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      background: #090d16;
      padding: 1rem;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .retry-bar input { flex: 1; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>Rowan Draw Catalog Studio</h1>
      <span class="badge">SQLite + Interactions API</span>
    </div>
    <div class="stats" id="stats-bar">
      Loading stats...
    </div>
    <div class="actions">
      <button class="btn-success" onclick="publishCatalog()">🚀 Publish to Mobile App</button>
    </div>
  </header>

  <main>
    <div class="filters">
      <div class="filter-group">
        <label>Category:</label>
        <select id="category-filter" onchange="loadVariants()">
          <option value="">All Categories</option>
        </select>
        <label>Status:</label>
        <select id="status-filter" onchange="loadVariants()">
          <option value="all">All Variants</option>
          <option value="pending" selected>Pending Review</option>
          <option value="accepted">Accepted</option>
          <option value="skipped">Skipped</option>
        </select>
      </div>
      <div>
        <button class="btn-secondary" onclick="loadVariants()">🔄 Refresh List</button>
      </div>
    </div>

    <div id="variants-container">
      Loading catalog...
    </div>
  </main>

  <script>
    async function fetchStats() {
      const res = await fetch('/api/stats');
      const data = await res.json();
      document.getElementById('stats-bar').innerHTML = `
        <span>Categories: <strong>${data.categories}</strong></span>
        <span>Subjects: <strong>${data.subjects}</strong></span>
        <span>Variants: <strong>${data.variants}</strong></span>
        <span>Accepted Images: <strong style="color: var(--success);">${data.acceptedImages}</strong></span>
        <span>Published: <strong>${data.publishedImages}</strong></span>
        <span>Total Cost: <strong>$${data.totalSpentUsd}</strong></span>
      `;
    }

    async function loadCategories() {
      const res = await fetch('/api/variants');
      const data = await res.json();
      const categories = [...new Set(data.map(v => v.category))];
      const select = document.getElementById('category-filter');
      select.innerHTML = '<option value="">All Categories</option>' + categories.map(c => `<option value="${c}">${c}</option>`).join('');
    }

    async function loadVariants() {
      const cat = document.getElementById('category-filter').value;
      const status = document.getElementById('status-filter').value;
      
      const res = await fetch(`/api/variants?category=${cat}&status=${status}`);
      const variants = await res.json();
      
      const container = document.getElementById('variants-container');
      if (variants.length === 0) {
        container.innerHTML = '<div style="text-align: center; padding: 3rem; color: var(--text-sub);">No variants found matching criteria.</div>';
        return;
      }

      container.innerHTML = variants.map(v => `
        <div class="variant-card" id="variant-${v.variantId}">
          <div class="variant-header">
            <div class="variant-title">
              <h2>${v.categoryName} / ${v.subjectName} — ${v.description}</h2>
              <div class="variant-meta">Key: <code>${v.key}</code> | Candidates: ${v.images.length}</div>
            </div>
            <div>
              <button class="btn-danger" onclick="skipVariant(${v.variantId})">Skip Variant</button>
            </div>
          </div>

          <div class="prompt-box">
            <label style="font-size: 0.75rem; color: var(--text-sub); display: block; margin-bottom: 0.3rem;">Image Generation Prompt:</label>
            <textarea id="prompt-${v.variantId}">${v.prompt}</textarea>
            <div class="prompt-actions">
              <button class="btn-secondary" onclick="updatePrompt(${v.variantId})">Save Prompt Override</button>
            </div>
          </div>

          <div class="images-grid">
            ${v.images.map(img => `
              <div class="image-card ${img.status}" id="img-card-${img.imageId}">
                <img src="${img.url}" alt="${v.description}" />
                <div class="image-controls">
                  <button class="${img.status === 'accepted' ? 'btn-success' : 'btn-secondary'}" onclick="toggleImageStatus(${img.imageId}, '${img.status === 'accepted' ? 'pending' : 'accepted'}')">
                    ${img.status === 'accepted' ? '✓ Accepted' : 'Accept Image'}
                  </button>
                  <button class="btn-danger" onclick="toggleImageStatus(${img.imageId}, 'rejected')">Reject</button>
                </div>
                ${img.difficulty ? `<div style="padding: 0 0.75rem; font-size: 0.75rem; color: var(--text-sub);">Difficulty: Level ${img.difficulty}</div>` : ''}
                ${img.tags.length ? `<div style="padding: 0.5rem 0.75rem;"><div class="tag-pills">${img.tags.map(t => `<span class="tag-pill">${t}</span>`).join('')}</div></div>` : ''}
              </div>
            `).join('')}
          </div>

          <div class="retry-bar">
            <label style="font-size: 0.85rem;">Generate Candidates:</label>
            <select id="model-${v.variantId}">
              <option value="gemini-3.1-flash-lite-image" selected>⚡ Nano Banana 2 Lite ($0.034/img)</option>
              <option value="gemini-3.1-flash-image">🎨 Nano Banana 2 ($0.067/img)</option>
              <option value="imagen-4.0-fast-generate-001">🚀 Imagen 4 Fast ($0.020/img)</option>
            </select>
            <input type="text" id="feedback-${v.variantId}" placeholder="Feedback (e.g. thicker lines, no background)..." value="${v.feedback || ''}">
            <button class="btn-primary" onclick="regenerateVariant(${v.variantId})">⚡ Generate Candidates Now</button>
          </div>
        </div>
      `).join('');

      fetchStats();
    }

    async function toggleImageStatus(imageId, status) {
      await fetch('/api/image-status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ imageId, status })
      });
      loadVariants();
    }

    async function updatePrompt(variantId) {
      const prompt = document.getElementById(`prompt-${variantId}`).value;
      await fetch('/api/update-prompt', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ variantId, customPrompt: prompt })
      });
      alert('Prompt override saved!');
    }

    async function regenerateVariant(variantId) {
      const modelId = document.getElementById(`model-${variantId}`).value;
      const feedback = document.getElementById(`feedback-${variantId}`).value;
      
      const btn = event.target;
      btn.innerText = 'Generating...';
      btn.disabled = true;

      try {
        const res = await fetch('/api/regenerate', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ variantId, modelId, feedback })
        });
        const data = await res.json();
        if (data.ok) {
          loadVariants();
        } else {
          alert('Error generating images: ' + data.error);
        }
      } catch (err) {
        alert('Error: ' + err.message);
      } finally {
        btn.innerText = '⚡ Generate Candidates Now';
        btn.disabled = false;
      }
    }

    async function skipVariant(variantId) {
      if (!confirm('Are you sure you want to skip/archive this variant?')) return;
      await fetch('/api/skip-variant', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ variantId })
      });
      loadVariants();
    }

    async function publishCatalog() {
      if (!confirm('Publish all accepted images to library/ and update manifest.json for mobile app?')) return;
      const res = await fetch('/api/publish', { method: 'POST' });
      const data = await res.json();
      if (data.ok) {
        alert('Catalog published successfully!');
        loadVariants();
      } else {
        alert('Publish error: ' + data.error);
      }
    }

    loadCategories();
    loadVariants();
  </script>
</body>
</html>
